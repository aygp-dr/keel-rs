[package]
name = "keel"
description = "The forth-keel kernel: one linear memory, two stacks, 13 primitives, and the NEXT inner interpreter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]

# Property tests only (keel/tests/properties.rs). The kernel itself stays
# dependency-free; hegeltest needs Rust 1.86+, the kernel 1.74+.
# static-engine links the Hypothesis-derived engine in rather than loading it
# at run time.
[dev-dependencies]
hegeltest = { version = "0.52", features = ["static-engine"] }

